version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pokeapi_db
    restart: always
    command: ["postgres", "-p", "7274"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokepassword123}
      POSTGRES_DB: ${POSTGRES_DB:-pokedb}
    networks:
      - backend_db_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokeuser} -d ${POSTGRES_DB:-pokedb} -p 7274"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pokeapi_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT:-7274}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pokeuser}:${POSTGRES_PASSWORD:-pokepassword123}@db:${POSTGRES_PORT:-7274}/${POSTGRES_DB:-pokedb}
    networks:
      - backend_db_net
      - frontend_backend_net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: pokeapi_frontend
    restart: always
    ports:
      - "5173:80"
    networks:
      - frontend_backend_net
    depends_on:
      - backend

networks:
  backend_db_net:
    internal: true
  frontend_backend_net:
    driver: bridge

volumes:
  postgres_data:

